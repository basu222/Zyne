<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyne Wallet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .hidden { display: none; }
        .balance-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .balance-box h2 { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
        .balance-box h1 { font-size: 42px; font-weight: 700; }
        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-box h3 { font-size: 24px; color: #667eea; }
        .stat-box p { font-size: 12px; color: #666; margin-top: 5px; }
        .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-logout { background: #dc3545; margin-top: 10px; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; margin-top: 10px; }
        .success-msg { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; }
        .error-msg { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-top: 15px; display: none; }
        .upi-display { background: #f8f9fa; padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; text-align: center; color: #333; }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="card" id="loginScreen">
        <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Zyne Wallet Login</h2>
        <label style="font-weight: 600; color: #333;">Enter Your UPI ID</label>
        <input type="text" id="loginUpiId" placeholder="yourname@paytm">
        <button class="btn" onclick="login()">Login to Wallet</button>
        <div class="error-msg" id="loginError"></div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div class="card hidden" id="dashboardScreen">
        <div class="upi-display">Logged in: <b id="displayUpi"></b></div>
        
        <div class="balance-box">
            <h2>Your Balance</h2>
            <h1>₹<span id="balance">0</span></h1>
        </div>

        <div class="stats">
            <div class="stat-box">
                <h3 id="tasksCount">0</h3>
                <p>Tasks Done</p>
            </div>
            <div class="stat-box">
                <h3>₹10</h3>
                <p>Min Withdraw</p>
            </div>
        </div>

        <button class="btn" id="withdrawBtn" onclick="requestWithdraw()">Withdraw Money</button>
        <button class="btn btn-logout" onclick="logout()">Logout</button>
        
        <div class="success-msg" id="successMsg">✅ Withdraw request sent! Admin will send money soon.</div>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xnbunwwcbrvydyxuixmc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_WoTzyIfDVAMTBNJOtP6r4Q_GbOeAgin';
        const TELEGRAM_BOT_TOKEN = '8645227789:AAEbpT3bW_qSUllPG4vgZ5NnoRnYXUPjYR8';
        const TELEGRAM_CHAT_ID = '1761198919'; // Nee Chat ID - withdrawal request ikkada vastadi
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;

        // 1. LOGIN FUNCTION - UPI ID tho
        async function login() {
            const upiId = document.getElementById('loginUpiId').value.trim();
            const errorDiv = document.getElementById('loginError');
            errorDiv.style.display = 'none';

            if (!upiId || !upiId.includes('@')) {
                return showLoginError('Valid UPI ID pettu bro');
            }

            try {
                // Check if user exists in DB
                const { data, error } = await supabaseClient
                    .from('zyne_users')
                    .select('*')
                    .eq('upi_id', upiId)
                    .single();

                if (error && error.code !== 'PGRST116') throw error;

                if (data) {
                    // Existing user
                    currentUser = data;
                } else {
                    // New user - create with 0 balance
                    const { data: newUser, error: insertErr } = await supabaseClient
                        .from('zyne_users')
                        .insert({ upi_id: upiId, balance: 0, total_tasks: 0 })
                        .select()
                        .single();
                    if (insertErr) throw insertErr;
                    currentUser = newUser;
                }

                showDashboard();
            } catch (err) {
                showLoginError('Login failed: ' + err.message);
            }
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('displayUpi').innerText = currentUser.upi_id;
            document.getElementById('balance').innerText = currentUser.balance;
            document.getElementById('tasksCount').innerText = currentUser.total_tasks;
            document.getElementById('withdrawBtn').disabled = currentUser.balance < 10;
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginUpiId').value = '';
        }

        // 2. WITHDRAW FUNCTION - Niku Telegram lo message vastadi
        async function requestWithdraw() {
            const btn = document.getElementById('withdrawBtn');
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.style.display = 'none';

            if (currentUser.balance < 10) return showError('Minimum ₹10 undali');

            btn.disabled = true; btn.innerText = 'Processing...';
            try {
                // 1. Telegram ki message pampu - Niku notification vastadi
                const msg = `🔔 NEW WITHDRAW REQUEST\n\nUPI ID: ${currentUser.upi_id}\nAmount: ₹${currentUser.balance}\nTasks Done: ${currentUser.total_tasks}\n\nPampu ra babu 💸`;
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(msg)}`);

                // 2. DB lo balance 0 chey - space save cheyadaniki old records delete cheyachu
                const { error } = await supabaseClient
                    .from('zyne_users')
                    .update({ balance: 0, last_updated: new Date() })
                    .eq('upi_id', currentUser.upi_id);
                if (error) throw error;

                currentUser.balance = 0;
                document.getElementById('balance').innerText = '0';
                document.getElementById('successMsg').style.display = 'block';
                btn.innerText = 'Request Sent';
            } catch (err) {
                showError('Error: ' + err.message);
                btn.disabled = false; btn.innerText = 'Withdraw Money';
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.innerText = msg; errorDiv.style.display = 'block';
        }
        function showLoginError(msg) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.innerText = msg; errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
