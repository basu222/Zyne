<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Zyne Wallet</title>

<style>

body{
margin:0;
padding:0;
background:#050014;
font-family:Arial,sans-serif;
color:white;
}

.wallet-container{

max-width:420px;
margin:40px auto;
padding:20px;

}

.wallet-card{

background:linear-gradient(
135deg,
#6a00ff,
#2563ff
);

padding:28px;
border-radius:28px;

box-shadow:
0 0 40px rgba(98,0,255,.35);

margin-bottom:25px;

}

.wallet-title{

font-size:18px;
opacity:.8;
margin-bottom:10px;

}

.wallet-balance{

font-size:42px;
font-weight:bold;

}

.wallet-sub{

margin-top:8px;
opacity:.8;
font-size:14px;

}

.withdraw-box{

background:#0d0820;
padding:20px;
border-radius:22px;

border:
1px solid rgba(255,255,255,.08);

}

.input{

width:100%;
padding:16px;
margin-bottom:15px;

border:none;
outline:none;

border-radius:14px;

background:#17112d;

color:white;
font-size:15px;

box-sizing:border-box;

}

.withdraw-btn{

width:100%;
padding:16px;

border:none;
border-radius:14px;

font-size:17px;
font-weight:bold;

cursor:pointer;

background:linear-gradient(
135deg,
#7b00ff,
#2563ff
);

color:white;

}

.withdraw-btn:hover{

opacity:.9;

}

.history{

margin-top:25px;

}

.history-title{

font-size:20px;
font-weight:bold;
margin-bottom:15px;

}

.history-item{

background:#0d0820;

padding:15px;

border-radius:16px;

margin-bottom:12px;

display:flex;

justify-content:space-between;

align-items:center;

border:
1px solid rgba(255,255,255,.06);

}

.status{

font-size:13px;

padding:5px 10px;

border-radius:20px;

}

.pending{

background:rgba(255,166,0,.12);

color:orange;

}

.success{

background:rgba(0,255,120,.12);

color:#00ff88;

}

</style>
</head>

<body>

<div class="wallet-container">

<div class="wallet-card">

<div class="wallet-title">
Available Balance
</div>

<div
class="wallet-balance"
id="balance"
>
₹0
</div>

<div
class="wallet-sub"
id="earned"
>
Total Earned ₹0
</div>

</div>

<div class="withdraw-box">

<input
type="text"
id="upi"
class="input"
placeholder="Enter UPI ID"
/>

<input
type="number"
id="amount"
class="input"
placeholder="Enter Amount"
/>

<button
class="withdraw-btn"
onclick="withdrawMoney()"
>
Withdraw Now
</button>

</div>

<div class="history">

<div class="history-title">
Recent Rewards
</div>

<div id="history"></div>

</div>

</div>

<script>

const API =
'https://zyne-backend-3rbw.onrender.com';

async function loadWallet(){

const upi =
document.getElementById('upi')
.value;

if(!upi){
return;
}

try{

const res =
await fetch(
`${API}/wallet`,
{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
upi_id:upi
})

}
);

const data =
await res.json();

document
.getElementById('balance')
.innerText =
`₹${data.balance || 0}`;

document
.getElementById('earned')
.innerText =
`Total Earned ₹${data.total_earned || 0}`;

loadHistory(upi);

}catch(err){

console.log(err);

}

}

async function loadHistory(upi){

try{

const res =
await fetch(
`${API}/history`,
{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
upi_id:upi
})

}
);

const data =
await res.json();

let html = '';

data.forEach((item)=>{

html += `

<div class="history-item">

<div>
₹${item.amount}
</div>

<div class="status success">
Completed
</div>

</div>

`;

});

document
.getElementById('history')
.innerHTML = html;

}catch(err){

console.log(err);

}

}

async function withdrawMoney(){

const upi =
document.getElementById('upi')
.value;

const amount =
document.getElementById('amount')
.value;

if(!upi || !amount){

alert('Fill all details');

return;

}

try{

const res =
await fetch(
`${API}/withdraw`,
{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

upi_id:upi,
amount:amount

})

}
);

const data =
await res.json();

if(data.success){

alert(
'Withdrawal Request Submitted'
);

loadWallet();

}else{

alert(
data.error || 'Error'
);

}

}catch(err){

alert('Server Error');

}

}

document
.getElementById('upi')
.addEventListener(
'input',
loadWallet
);

</script>

</body>
</html>
