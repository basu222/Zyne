<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Zyne Offer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050014;

background-image:
radial-gradient(circle at top left,
rgba(98,0,255,0.35),
transparent 30%),

radial-gradient(circle at right,
rgba(0,140,255,0.18),
transparent 25%);

color:white;

padding:20px;
}

.container{

max-width:520px;

margin:auto;
}

.card{

background:
rgba(255,255,255,0.04);

border:
1px solid rgba(255,255,255,0.08);

border-radius:30px;

overflow:hidden;

backdrop-filter:blur(12px);

box-shadow:
0 0 30px rgba(98,0,255,0.18);
}

.banner{

width:100%;
height:240px;
object-fit:cover;
}

.content{

padding:24px;
}

.badge{

display:inline-block;

padding:8px 16px;

border-radius:999px;

background:
rgba(106,0,255,0.15);

border:
1px solid rgba(106,0,255,0.3);

color:#9e8bff;

font-size:13px;

font-weight:bold;

margin-bottom:18px;
}

.title{

font-size:34px;

margin-bottom:12px;
}

.reward{

font-size:28px;

font-weight:bold;

color:#8f7cff;

margin-bottom:22px;
}

.desc{

color:#cfcfcf;

line-height:1.7;

margin-bottom:28px;
}

.section{

margin-top:28px;

padding:20px;

border-radius:22px;

background:
rgba(255,255,255,0.03);

border:
1px solid rgba(255,255,255,0.08);
}

.section h3{

margin-bottom:14px;

color:#a58fff;
}

.section p{

line-height:1.8;

color:#d5d5d5;

white-space:pre-line;
}

.upi{

width:100%;

padding:17px;

border:none;

outline:none;

border-radius:18px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

color:white;

font-size:16px;

margin-top:26px;

margin-bottom:18px;
}

.btn{

width:100%;

padding:18px;

border:none;

border-radius:20px;

font-size:18px;

font-weight:bold;

cursor:pointer;

color:white;

background:
linear-gradient(
90deg,
#6a00ff,
#2f7bff
);

box-shadow:
0 0 25px rgba(98,0,255,0.35);
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<img
id="image"
class="banner"
/>

<div class="content">

<div class="badge">
🔥 Trusted Partner Offer
</div>

<div
id="title"
class="title"
>
Loading...
</div>

<div class="reward">
Earn ₹<span id="reward">0</span>
</div>

<div
id="description"
class="desc"
></div>

<input
type="text"
id="upi"
class="upi"
placeholder="Enter UPI ID"
/>

<button
class="btn"
onclick="startOffer()"
>
Submit & Start
</button>

<div class="section">

<h3>
📋 How To Complete
</h3>

<p id="steps"></p>

</div>

<div class="section">

<h3>
⚡ Important Notes
</h3>

<p>

• Complete all steps carefully

• Use genuine details only

• Rewards are tracked automatically

• Some offers may take time
to verify

</p>

</div>

</div>

</div>

</div>

<script>

const API =
'https://zyne-backend-3rbw.onrender.com';

let currentOffer = null;

const params =
new URLSearchParams(
window.location.search
);

const offerId =
params.get('id');

async function loadOffer(){

const res =
await fetch(
`${API}/offers`
);

const data =
await res.json();

const offer =
data.find(
o => o.id == offerId
);

currentOffer = offer;

document
.getElementById('title')
.innerText =
offer.title;

document
.getElementById('reward')
.innerText =
offer.reward;

document
.getElementById('description')
.innerText =
offer.description;

document
.getElementById('steps')
.innerText =
offer.steps;

document
.getElementById('image')
.src =
offer.image;
}

async function startOffer(){

const upi =
document
.getElementById('upi')
.value;

if(!upi){

alert(
'Enter UPI ID'
);

return;
}

const res =
await fetch(
`${API}/click`,
{

method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

upi_id:upi,

offer_id:
currentOffer.id

})
}
);

const data =
await res.json();

const click_id =
data.click_id;

const finalLink =
currentOffer
.tracking_link
+ click_id;

window.location.href =
finalLink;
}

loadOffer();

</script>

</body>
</html>
